# @package _global_

defaults:
  - override /dataset@datamodule: rmd17.yaml
  - override /model: gotennet.yaml
  - override /callbacks: default.yaml
  - override /logger: wandb.yaml # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - override /trainer: default.yaml

datamodule:
  hparams:
    seed: 1
    standardize: true
    splits: 0
    batch_size: 4
    inference_batch_size: 4

model:
  lr: 0.0002
  lr_warmup_steps: 1000
  lr_monitor: "validation/val_loss"
  lr_minlr: 1.e-07
  lr_patience: 30
  weight_decay: 0.01
  task_config:
    task_loss: "MSELoss"
    loss_weights:
        - 0.05
        - 0.95

  representation:
    n_interactions: 12
    n_atom_basis: 192
    radial_basis: "expnorm"
    n_rbf: 32
    edge_updates: "linw"
    lmax: 2
    evec_dim: 768
  output:
    n_hidden: 192

trainer:
  max_epochs: 3000
  inference_mode: False
  gradient_clip_val: 10.0

callbacks:
  early_stopping:
    monitor: "validation/val_loss"
    patience: 3000 
  model_checkpoint:
    monitor: "validation/val_loss"
project: "ExpressiveGeoNet_rmd17"

task: "rMD17"
