# @package _global_

defaults:
  - rmd17.yaml

datamodule:
  hparams:
    batch_size: 4
    # Validation / test no longer retain higher-order derivative graphs, so
    # we can safely recover a much larger evaluation batch here.
    inference_batch_size: 16
    persistent_workers: true
    prefetch_factor: 4

model:
  # Slightly lower LR + longer warmup generally makes the force-training path
  # less spiky on rMD17 while still converging quickly.
  lr: 0.00015
  lr_warmup_steps: 1500
  lr_monitor: "validation/MeanAbsoluteError_force"
  lr_decay: 0.7
  lr_patience: 20
  # AdamW decay is applied to the full parameter set in this repo, so a
  # smaller value is a safer high-accuracy default than the paper-style 1e-2.
  weight_decay: 0.001
  representation:
    attn_dropout: 0.05

trainer:
  gradient_clip_val: 5.0
  gradient_clip_algorithm: norm

callbacks:
  early_stopping:
    monitor: "validation/MeanAbsoluteError_force"
    patience: 500
    min_delta: 1e-5
  model_checkpoint:
    monitor: "validation/MeanAbsoluteError_force"

project: "ExpGeoNet_rmd17_tuned"
