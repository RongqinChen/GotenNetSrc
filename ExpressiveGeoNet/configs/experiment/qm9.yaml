# @package _global_

defaults:
  - override /dataset@datamodule: qm9.yaml
  - override /model: gotennet.yaml
  - override /callbacks: default.yaml
  - override /logger: wandb.yaml # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - override /trainer: default.yaml

datamodule:
  hparams:
    batch_size: 32
    seed: 1
    standardize: false

model:
  # Table 6 reports a per-target learning-rate range of [6e-5, 1e-4].
  # This base config uses the upper bound; override `model.lr` for target-specific sweeps.
  lr: 0.0001
  lr_warmup_steps: 10000
  lr_monitor: "validation/val_loss"
  lr_minlr: 1.e-07
  lr_patience: 15
  weight_decay: 0.01
  task_config:
    task_loss: "MSELoss"
  representation:
    n_interactions: 6
    n_atom_basis: 256
    radial_basis: "expnorm"
    n_rbf: 64
  output:
    n_hidden: 256

trainer:
  max_epochs: 1000
  gradient_clip_val: 10.0

callbacks:
  early_stopping:
    monitor: "validation/val_loss" # name of the logged metric which determines when model is improving
    patience: 1000 # keep the paper's fixed 1000-epoch budget by default
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: "validation/MeanAbsoluteError_${label_str}" # name of the logged metric which determines when model is improving
